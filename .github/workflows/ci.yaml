name: CI

# Each job runs only when something it reads changed, so a site change does not wait on the
# Lua harness and an addon change does not start Postgres. The filter lives in a job rather
# than in `on: paths`: all four jobs are required checks, and a workflow skipped by `paths`
# reports nothing, which leaves the PR waiting forever. A job skipped by `if` reports success.
on:
  pull_request:
  push:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      addons: ${{ steps.filter.outputs.addons }}
      quests: ${{ steps.filter.outputs.quests }}
      web: ${{ steps.filter.outputs.web }}
      zones: ${{ steps.filter.outputs.zones }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each list is what its job reads, not only where its code lives. Every list names
          # this file, so a change to CI runs all of it.
          filters: |
            addons:
              - .github/workflows/ci.yaml
              - Makefile
              - addons/**
              - tests/**
            quests:
              - .github/workflows/ci.yaml
              - pipelines/quests/**
              # test_package.py runs the packaging scripts over the real addon folders.
              - addons/**
              - scripts/**
            web:
              - .github/workflows/ci.yaml
              - apps/web/**
              # The site bundles the zones and books pipelines and pipelines/lib, and CI seeds
              # its database from the quests corpus through the Python importer.
              - pipelines/**
              - deploy/web/**
              # Pack metadata (scripts/lib/packs.mjs reads publishers/) and the envelopes the
              # Lua harness writes for the contribution tests.
              - scripts/lib/**
              - publishers/**
              - tests/fixtures/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            zones:
              - .github/workflows/ci.yaml
              - pipelines/zones/**
              - pipelines/lib/**
              - addons/Spoken_Zones/**
              # descriptions --check compares publishers/ with the READMEs generated from it.
              - publishers/**
              - addons/*/README.md
              - scripts/descriptions.mjs
              - scripts/lib/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  addons:
    name: Addons (Lua)
    needs: changes
    if: needs.changes.outputs.addons == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit
      # The stub client is Lua 5.1, which is what 1.12 through retail all run.
      - run: make test-player

  quests-python:
    name: Quests pipeline (Python)
    needs: changes
    if: needs.changes.outputs.quests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/quests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # 3.11, from both ends: tts_cli uses `match` and `int | None`, which need 3.10,
          # and requirements-extract pins pandas 1.5.3, whose last wheels are cp311.
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # test_package.py runs scripts/quests/package.sh for real and asserts which .toc and
      # which vendored Ace3 each client's zip carries, so it needs the whole tree.
      - run: python -m pytest -q

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spoken/web typecheck
      # Several suites run against a real Postgres on purpose: the invariants they protect
      # live in schema constraints, so a mocked database would stop testing them.
      - run: deploy/web/bin/migrate.sh "$PWD/apps/web"
      # The quests corpus lives in Postgres now, and the quests suites read it from there.
      # Seeded from the committed export, exactly as `make quests-import-corpus` does it --
      # the importer is Python so that the export round trip stays byte-identical.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-extract.txt
        working-directory: pipelines/quests
      - run: python cli-main.py import-corpus
        working-directory: pipelines/quests
      - run: pnpm --filter @spoken/web test

  zones-pipeline:
    name: Zones pipeline
    needs: changes
    if: needs.changes.outputs.zones == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # validate.mjs is what asserts no square bracket survives into spoken text -- the one
      # normalisation rule that is not cosmetic, since eleven_v3 reads [...] as a tag.
      - run: node pipelines/zones/tools/validate.mjs
      - run: node scripts/descriptions.mjs --check
      - run: node pipelines/zones/tools/locale/check-strings.mjs
