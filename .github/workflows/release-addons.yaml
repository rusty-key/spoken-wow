name: Release addons

# Publishes an addon's zip to a GitHub release, beside the store uploads, for players who
# install by hand.
#
# The tag prefix picks the addon, because the two version independently and always have:
#
#     spoken/v1.0.0   ->  addons/Spoken
#     quests/v2.0.0   ->  addons/Spoken_Quests
#     zones/v1.0.0    ->  addons/Spoken_Places
#     books/v2.0.0    ->  addons/Spoken_Readables
#
# Unprefixed v*.*.* tags are deliberately not matched: seventeen of them already exist
# from the AI_VoiceOver_Continued lineage and were imported as legacy/quests/v*.
#
# The sound packs are not here and cannot be. Their audio lives outside git, so a runner has
# nothing to zip; scripts/audio-github-release.sh publishes them from the machine that built
# them, under <pack>-audio/vX.Y.Z tags this job deliberately does not match.
on:
  push:
    tags:
      - "spoken/v*.*.*"
      - "quests/v*.*.*"
      - "zones/v*.*.*"
      - "books/v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Everything below is addressed through these three, so adding the player addon is
      # one entry rather than a second copy of the job.
      - name: Resolve the target from the tag
        id: target
        run: |
          case "${GITHUB_REF_NAME%%/*}" in
            spoken) toc=addons/Spoken/Spoken.toc;               script=scripts/spoken/package.sh ;;
            quests) toc=addons/Spoken_Quests/Spoken_Quests.toc;   script=scripts/quests/package.sh ;;
            zones)  toc=addons/Spoken_Places/Spoken_Places.toc;     script=scripts/zones/package.sh  ;;
            books)  toc=addons/Spoken_Readables/Spoken_Readables.toc;     script=scripts/books/package.sh  ;;
            *)      echo "unknown tag prefix in ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          {
            echo "name=${GITHUB_REF_NAME%%/*}"
            echo "toc=$toc"
            echo "script=$script"
          } >> "$GITHUB_OUTPUT"

      # The .toc is the source of the version and the tag has to agree with it. This used to
      # run the other way round - the tag was substituted into every .toc over a placeholder
      # that stopped existing - which meant a tag could name a version the tree never had.
      - name: Check the tag against the TOC
        id: version
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' \
            "${{ steps.target.outputs.toc }}" | head -1 | tr -d '\r')"
          if [ "${{ steps.target.outputs.name }}/v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match ## Version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The packaging script and nothing else, so a release zip is the same artifact the
      # author builds locally.
      - name: Build the zips
        run: ./${{ steps.target.outputs.script }}

      # Rendered here rather than by cuchi/jinja2-action: that action is a Docker action, so
      # the runner builds its image before any step of this job runs, and its Dockerfile no
      # longer builds - which failed the whole workflow before it reached the first step.
      # Substitution into a fixed template needs no template engine anyway, and this keeps the
      # engine's one useful behaviour: an unfilled placeholder is an error, not empty text.
      # Only the quests addon has a template. Spoken's notes are its changelog section (the next
      # step); zones and books take GitHub's generated notes.
      - name: Render the release notes
        if: steps.target.outputs.name == 'quests'
        env:
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          download, version = os.environ["DOWNLOAD"], os.environ["VERSION"]
          variables = {
              "github_zip_download_blizz": f"{download}/Spoken_Quests-{version}.zip",
              "curse_link_blizz": "https://www.curseforge.com/wow/addons/spoken-quests",
              # Wago carries the addons but not the packs: each pack is 300-450 MB and that
              # upload endpoint answers 413, so only the player has a second store link.
              "wago_link_blizz": "https://addons.wago.io/addons/spoken-quests",
              "curse_link_pack_alliance": "https://www.curseforge.com/wow/addons/spoken-audio-quests-alliance",
              "curse_link_pack_horde": "https://www.curseforge.com/wow/addons/spoken-audio-quests-horde",
              "curse_link_pack_shared": "https://www.curseforge.com/wow/addons/spoken-audio-quests-shared",
              "curse_link_pack_gossip": "https://www.curseforge.com/wow/addons/spoken-audio-gossip",
          }

          with open(".github/release-template.md", encoding="utf-8") as handle:
              template = handle.read()

          missing = []

          def substitute(match):
              name = match.group(1)
              if name not in variables:
                  missing.append(name)
                  return match.group(0)
              return variables[name]

          rendered = re.sub(r"{{\s*([a-z_0-9]+)\s*}}", substitute, template)
          if missing:
              sys.exit(f"release-template.md uses undefined variables: {', '.join(sorted(set(missing)))}")

          with open("release_notes.md", "w", encoding="utf-8") as handle:
              handle.write(rendered)
          PY

      # The same section scripts/spoken/release.sh sends to the stores, so the GitHub release and
      # the store pages say the same. A tag whose version has no section fails here, before a
      # release with no notes is made.
      - name: Take Spoken's notes from its changelog
        if: steps.target.outputs.name == 'spoken'
        run: node scripts/lib/changelog.mjs section docs/spoken/CHANGELOG.md "${{ steps.version.outputs.version }}" > release_notes.md

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.target.outputs.name != 'spoken' }}
          body_path: ${{ (steps.target.outputs.name == 'quests' || steps.target.outputs.name == 'spoken') && 'release_notes.md' || '' }}
          files: |
            dist/*.zip
