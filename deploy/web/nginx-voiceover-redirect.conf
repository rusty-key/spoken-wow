# What is left of voiceover.rusty.one once spoken.quest is serving.
#
# The site moved; the addresses did not. Every Report button in every installed copy of
# Spoken Quests builds https://voiceover.rusty.one/r/quest/1234/accept from a quest id and
# an event, and those copies are in players' hands and will not all update. So this host
# keeps answering, forever, and forwards.
#
# 301 rather than 302: the target is permanent, and a permanent redirect is the one a
# browser and a search engine will both stop asking about.
#
# Replaced the old voiceover vhost at the merge. The certificate stays, because
# the redirect has to be served over https -- a player whose link is https and whose
# browser refuses the downgrade would otherwise get nothing.
#
#   sudo cp deploy/web/nginx-voiceover-redirect.conf /etc/nginx/sites-available/voiceover
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name voiceover.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voiceover.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/voiceover.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/voiceover.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/voiceover.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/voiceover.access.log;
    error_log  /var/log/nginx/voiceover.error.log;

    # The one that matters: the addon's Report button.
    #
    #   /r/quest/1234/accept  ->  /quests/r/quest/1234/accept
    #   /r/npc/5678           ->  /quests/r/npc/5678
    #
    # ReportButton.lua built "%s/r/%s" from this host and a target of 'quest/{id}/{event}'
    # or 'npc/{id}'. Whatever follows /r/ is carried across untouched, because the landing
    # page on the other side parses it with the same rules this host's did.
    # A regex location, because the capture is the whole point: a prefix location has no
    # $1, and `return 301 .../quests/r/$1` under one would redirect to a literal dollar-one.
    #
    # `return` does not append the query string the way `rewrite` does, so it is named.
    location ~ ^/r/(.*)$ {
        return 301 https://spoken.quest/quests/r/$1$is_args$args;
    }

    # The retired complete sound pack's URL, pasted into old CurseForge descriptions and sitting
    # in download managers. The path is identical on the other side, which redirects it on.
    location /downloads/ {
        return 301 https://spoken.quest$request_uri;
    }

    # Everything else lands on the section this host used to be.
    #
    # Not $request_uri: a bookmark of /voices or /lexicon is a bookmark of a page that
    # still exists under its own name, and sending it to /quests/voices would 404. Those
    # pages are shared now, so the honest answer for an unrecognised path is the section's
    # front page rather than a guess at where its contents went.
    # The explorer's search is in the query, which `return` does not carry by itself.
    location = / {
        return 301 https://spoken.quest/quests$is_args$args;
    }

    location / {
        return 301 https://spoken.quest$request_uri;
    }
}
