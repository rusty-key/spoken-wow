# The API routes that need more than a plain proxy, for every address that serves the API.
# nginx-spoken.conf and nginx-spoken-rusty-redirect.conf both include it, so an installed Manager
# on the old address gets the same upload limits and timeouts as the site.
#
#   sudo cp deploy/web/nginx-spoken-api.conf /etc/nginx/snippets/spoken-api.conf

# Both addresses are behind Cloudflare. Without this, every player behind one edge shares one
# rate-limit bucket. Trusted from these ranges only (https://www.cloudflare.com/ips/), so a
# request made straight to the droplet cannot forge the header.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# EVERY audio route, in one regex block: each section's live take and any take by
# version (/api/takes/audio), all streamed by lib/takes/serve.ts. The app answers Range
# itself and nginx forwards the header untouched, so everything here exists to keep that
# response byte-exact: Safari opens audio with `Range: bytes=0-1` and refuses a resource
# that answers 200.
#
# A voice actor's recording (/api/recordings/audio) is played the same way, through the
# same serveFile, and needs the same.
location ~ ^/api/((quests|places|readables)/audio/|takes/audio|recordings/audio) {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    # Stream straight through. With buffering on, nginx accumulates the upstream
    # response (spilling to disk past proxy_buffers) before answering, which adds
    # latency to every seek and churns disk for gigabytes of audio.
    proxy_buffering off;
    proxy_request_buffering off;

    # Never gzip mp3: it is already compressed, so this is pure CPU. It would also put
    # nginx in the business of rewriting a body the Range headers describe.
    gzip off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A cache that is not Range-aware will serve truncated audio, so make sure a
    # globally configured proxy_cache does not apply here.
    proxy_cache off;
}
# The contributors' text API (apps/web/src/lib/text-api). A mass update of 1,000 lines can be
# several megabytes, which the default 1m would 413, and it writes one line at a time, which can
# outlast the 60s the / block allows and cut the run off partway. GET /api/v1 and TEXT-API.md state
# this body limit, so change them with it.
location /api/v1/ {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    client_max_body_size 8m;
    proxy_read_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Voice clips are uploaded through the app. nginx defaults client_max_body_size to 1m,
# which would 413 every real clip before it reached Next.js. This matches the app's own
# ceiling of 50 MiB per voice rather than guessing at one. Self-hosted Next.js has no
# body-size limit of its own - the 4.5 MB figure people quote is Vercel's.
location /api/voices/ {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    client_max_body_size 50m;

    # Cloning uploads every clip to ElevenLabs and merging shells out to ffmpeg, so both
    # outlast the 60s the / block allows.
    proxy_read_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Voice actors' recordings, one file per request (api/recordings/route.ts). Sized to the
# app's 25 MiB per file, with room for the multipart around it. A prefix without the
# trailing slash, because the upload is POSTed to /api/recordings itself; the audio route
# under it is caught by the streaming block above, as regex locations win over prefixes.
location /api/recordings {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    client_max_body_size 30m;

    # A whole file is probed with ffprobe before it is kept, after a slow upload.
    proxy_read_timeout 120s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A player's gathered lines, sent as one upload: up to 2,000 envelopes of a few kilobytes
# each, so several megabytes where nginx's default 1m would 413 a long evening's play. The
# route refuses more than 2,000 envelopes itself; this only has to let the largest honest
# file through.
location = /api/contributions/batch {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    client_max_body_size 16m;
    # Room for a full file on a busy droplet, past the 60s the / block allows. Cloudflare still
    # ends the request at 100s, so the rest only matters to a call made straight to the droplet.
    proxy_read_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A single line is generated inside the request, on either section, and ElevenLabs can
# take well past a minute over a long one. A batch does not need this -- it is queued in
# Postgres and the request returns immediately -- but the one-click path would 504.
location ~ ^/api/(quests|places)/regenerate$ {
    proxy_pass http://spoken_app;
    proxy_http_version 1.1;

    proxy_read_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
