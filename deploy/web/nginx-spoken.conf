# nginx vhost for Spoken.
#
# Get the certificate first, then install this file - in that order, because nginx will
# not start if it references a certificate that does not exist yet:
#   sudo certbot certonly --nginx -d spoken.rusty.one
#   sudo cp deploy/web/nginx-spoken.conf /etc/nginx/sites-available/spoken
#   sudo ln -s /etc/nginx/sites-available/spoken /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Use `certonly`, not `certbot --nginx`: the installer picks the server block it thinks
# matches, and a wildcard `*.example.com` block elsewhere in the config will win over a
# vhost like this one. It then writes the certificate into that block and leaves this file
# without TLS at all.

# WHERE THE APP IS, IN ONE PLACE.
#
# The port appears in four proxy_pass blocks, and before the cutover it is not 3000: that
# port belongs to voiceover until it is stopped, so the site is staged on 3002 first. A
# named upstream makes moving between them one line rather than four, which matters because
# the one occurrence somebody misses is the one that 502s.
#
# Staging:  server 127.0.0.1:3002;   and PORT=3002 in shared/app.env
# Cutover:  server 127.0.0.1:3000;   and that PORT line deleted
upstream spoken_app {
    server 127.0.0.1:3002;

    # Keep connections open between nginx and the app rather than opening one per request.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name spoken.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    # `listen ... ssl http2` rather than the `http2 on` directive: this targets nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spoken.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/spoken.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spoken.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spoken.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/spoken.access.log;
    error_log  /var/log/nginx/spoken.error.log;

    # EVERY audio route, in one regex block: each section's live take and any take by
    # version (/api/takes/audio), all streamed by lib/takes/serve.ts. The app answers Range
    # itself and nginx forwards the header untouched, so everything here exists to keep that
    # response byte-exact: Safari opens audio with `Range: bytes=0-1` and refuses a resource
    # that answers 200.
    #
    # A voice actor's recording (/api/recordings/audio) is played the same way, through the
    # same serveFile, and needs the same.
    location ~ ^/api/((quests|places|readables)/audio/|takes/audio|recordings/audio) {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        # Stream straight through. With buffering on, nginx accumulates the upstream
        # response (spilling to disk past proxy_buffers) before answering, which adds
        # latency to every seek and churns disk for gigabytes of audio.
        proxy_buffering off;
        proxy_request_buffering off;

        # Never gzip mp3: it is already compressed, so this is pure CPU. It would also put
        # nginx in the business of rewriting a body the Range headers describe.
        gzip off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cache that is not Range-aware will serve truncated audio, so make sure a
        # globally configured proxy_cache does not apply here.
        proxy_cache off;
    }

    # The complete quests pack, every line in one folder, is retired: nothing builds or offers it.
    # Its address is pasted in old store descriptions and download managers, so it lands on the
    # meta addon that installs the four packs instead. The longer prefix wins over /downloads/
    # below, which would otherwise answer with a 404 or a stale copy.
    location ^~ /downloads/SpokenQuestsAudioComplete {
        return 301 https://www.curseforge.com/wow/addons/spoken-quests-audio-all;
    }

    # Files offered as a direct download.
    #
    # SERVED OFF DISK, NEVER PROXIED. Next.js in the request path for a gigabyte buys
    # nothing and costs a worker for the length of every download; nginx does this with
    # sendfile and forgets about it. Static files also answer Range by themselves, so an
    # interrupted download resumes instead of starting again.
    #
    # A DIRECTORY OF ITS OWN, not shared/ itself. shared/ holds app.env - the database URL,
    # the auth secret, the key the stored ElevenLabs credentials are sealed with - and
    # aliasing a directory that contains secrets is one chmod away from serving them.
    # downloads/ holds nothing but zips.
    #
    location /downloads/ {
        # A symlink onto the /mnt/voice volume (deploy/web/store.sh). nginx follows it:
        # disable_symlinks is off by default, and this is root-owned infrastructure rather
        # than a user-writable tree, which is what that setting exists to defend.
        alias /srv/spoken/shared/downloads/;

        # No listing: an index would advertise every superseded file left lying there.
        autoindex off;

        # Already compressed, and gzipping it would only burn CPU to make it slightly larger.
        gzip off;

        # No Cache-Control on purpose: a -latest name is a symlink whose target changes, so a
        # long max-age would pin players to an old file for as long as it lasted; nginx's
        # Last-Modified and ETag make a repeat download conditional anyway.
    }

    # Voice clips are uploaded through the app. nginx defaults client_max_body_size to 1m,
    # which would 413 every real clip before it reached Next.js. This matches the app's own
    # ceiling of 50 MiB per voice rather than guessing at one. Self-hosted Next.js has no
    # body-size limit of its own - the 4.5 MB figure people quote is Vercel's.
    location /api/voices/ {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        client_max_body_size 50m;

        # Cloning uploads every clip to ElevenLabs and merging shells out to ffmpeg, so both
        # outlast the 60s the / block allows.
        proxy_read_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice actors' recordings, one file per request (api/recordings/route.ts). Sized to the
    # app's 25 MiB per file, with room for the multipart around it. A prefix without the
    # trailing slash, because the upload is POSTed to /api/recordings itself; the audio route
    # under it is caught by the streaming block above, as regex locations win over prefixes.
    location /api/recordings {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        client_max_body_size 30m;

        # A whole file is probed with ffprobe before it is kept, after a slow upload.
        proxy_read_timeout 120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A Manager's answer carries a line's audio as base64 JSON; a long fish.audio line runs to a
    # few megabytes, where nginx's default 1m would 413 it.
    location /api/worker/ {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        client_max_body_size 32m;

        # The answer is trimmed, stitched, measured and encoded before the route returns.
        proxy_read_timeout 120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A player's gathered lines, sent as one upload: up to 2,000 envelopes of a few kilobytes
    # each, so several megabytes where nginx's default 1m would 413 a long evening's play. The
    # route refuses more than 2,000 envelopes itself; this only has to let the largest honest
    # file through.
    location = /api/contributions/batch {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        client_max_body_size 16m;
        # One insert per line, in order, so a full file can outlast the 60s the / block allows.
        proxy_read_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single line is generated inside the request, on either section, and ElevenLabs can
    # take well past a minute over a long one. A batch does not need this -- it is queued in
    # Postgres and the request returns immediately -- but the one-click path would 504.
    location ~ ^/api/(quests|places)/regenerate$ {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        proxy_read_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No /_next/static block on purpose: Next.js already answers those with
    # `Cache-Control: public, max-age=31536000, immutable`, and adding it here again just
    # emits the header twice.
    location / {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reuse upstream connections rather than opening one per request.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}
