# What is left of lore.rusty.one once spoken.quest is serving.
#
# The same bargain the voiceover redirect makes, with one extra shape to unpick. Spoken
# Zones up to 3.4.0 builds https://lore.rusty.one/{lang}/r/{mapID}/{slug} -- the language is
# in the address because a report is about the text and narration on screen -- and builds up
# to 0.3.1 sent /r/{mapID}/{slug} with no language at all. Both are in players' hands.
#
# The merged site takes the language as a path prefix, English bare, so the language is
# carried: a German report opens the German line.
#
#   sudo cp deploy/web/nginx-lore-redirect.conf /etc/nginx/sites-available/lore
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lore.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lore.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/lore.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/lore.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lore.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lore.access.log;
    error_log  /var/log/nginx/lore.error.log;

    # The report link, in both the forms the addon has ever emitted. English and no language
    # go to the bare address, which is where the site serves English (/enUS/... would only be
    # redirected again); any other language keeps its prefix.
    #
    #   /enUS/r/1411/razor-hill  ->  /places/r/1411/razor-hill
    #   /r/1411/razor-hill       ->  /places/r/1411/razor-hill
    #   /deDE/r/1411/razor-hill  ->  /deDE/places/r/1411/razor-hill
    #
    # Matched before the bare-language block below, because nginx takes the first regex
    # location that matches and /deDE/r/... matches both. The English one comes first for the
    # same reason.
    #
    # QUOTED, because of the braces. nginx parses the config before it parses the regex, and
    # an unquoted `{2}` closes the directive: this fails `nginx -t` with "missing closing
    # parenthesis", which reads like a bad regex and is not one.
    location ~ "^/(?:enUS/)?r/(\d+)/([^/]+)/?$" {
        return 301 https://spoken.quest/places/r/$1/$2;
    }

    location ~ "^/([a-z]{2}[A-Z]{2})/r/(\d+)/([^/]+)/?$" {
        return 301 https://spoken.quest/$1/places/r/$2/$3;
    }

    # A language's front page -- what the header's language switch linked to, and what
    # anybody who bookmarked the explorer has. The explorer's search is in the query
    # (?q=...), which `return` does not carry by itself, and the language goes along as it
    # does for the report links above.
    location ~ "^/enUS/?$" {
        return 301 https://spoken.quest/places$is_args$args;
    }

    location ~ "^/([a-z]{2}[A-Z]{2})/?$" {
        return 301 https://spoken.quest/$1/places$is_args$args;
    }

    location = / {
        return 301 https://spoken.quest/places$is_args$args;
    }

    # The three pages this site named differently. They are not gone - the merge made them
    # shared, under the quests side's spelling - so a bookmark of one has somewhere exact to
    # land, and sending it to a 404 instead would be throwing away a working address.
    #
    #   /voice, /{lang}/voice          ->  /voices
    #   /{lang}/pronunciation          ->  /lexicon
    #   /feedback, /{lang}/feedback    ->  /reports
    #
    # The language segment is optional and discarded.
    # Quoted for the braces, for the reason that block gives.
    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?voice/?$" {
        return 301 https://spoken.quest/voices;
    }

    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?pronunciation/?$" {
        return 301 https://spoken.quest/lexicon;
    }

    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?feedback/?$" {
        return 301 https://spoken.quest/reports;
    }

    # Everything else keeps its path, which is the right answer for the pages both sites
    # already spelled the same: /lexicon, /admin, /login, /register, /profile.
    location / {
        return 301 https://spoken.quest$request_uri;
    }
}
