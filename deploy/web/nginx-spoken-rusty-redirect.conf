# What is left of spoken.rusty.one now that spoken.quest is serving.
#
# Installed addons link here and installed Managers call here, and neither will all update, so
# this host keeps answering. Pages redirect. The API is proxied, because a Manager refuses
# redirects on sign-in (they would carry the password elsewhere) and following a 301 would turn
# its POST of gathered lines into a GET.
#
# The app must trust this origin, or those sign-ins answer 403 (trustedOrigins in
# apps/web/src/lib/auth.ts). spoken_app is defined in nginx-spoken.conf.
#
#   sudo cp deploy/web/nginx-spoken-rusty-redirect.conf /etc/nginx/sites-available/spoken-rusty
#   sudo ln -s /etc/nginx/sites-available/spoken-rusty /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name spoken.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spoken.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/spoken.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spoken.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spoken.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/spoken.access.log;
    error_log  /var/log/nginx/spoken.error.log;

    include /etc/nginx/snippets/spoken-api.conf;

    location /api/ {
        proxy_pass http://spoken_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }

    # A browser carries a Contribute link's #e1=... fragment across this redirect by itself.
    location / {
        return 301 https://spoken.quest$request_uri;
    }
}
